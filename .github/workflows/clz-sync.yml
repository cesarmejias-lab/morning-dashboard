name: CLZ Collection Sync

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  sync-clz:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the updated files back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CLZ Sync Script
        run: node sync-collection.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add music-collection.json music-collection.js
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update CLZ music collection"
          git push
