name: Sincronizador de Coleccion CLZ

on:
  schedule:
    # Se ejecuta todos los dias a las 05:00 UTC (07:00 en España)
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Permite activar la sincronizacion de forma manual con un boton desde la web de GitHub

permissions:
  contents: write # Permite al bot hacer push de la coleccion actualizada al repositorio

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20'

      - name: Sincronizar coleccion desde CLZ Cloud
        run: node sync-collection.js

      - name: Subir cambios al repositorio de GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add music-collection.json
          # Solo hace commit si hay cambios en la coleccion
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: Actualizacion de coleccion CLZ" && git push)
